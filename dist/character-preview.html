<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>새 캐릭터 · 메뉴 럼블</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#344d40;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:38px 24px}a{color:inherit;font-size:13px}h1{font-size:28px;letter-spacing:-1px;margin:32px 0 10px}p{font-size:14px;color:#79867b;line-height:1.7;margin:0}#stage{height:clamp(320px,47vw,490px);margin:12px -20px 0}#stage canvas{width:100%;height:100%;display:block}nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0 22px}button{font:inherit;font-size:14px;padding:12px 20px;border:1px solid #d4dfd1;border-radius:30px;background:transparent;color:#47614d;cursor:pointer}button[aria-pressed=true]{background:#365e46;border-color:#365e46;color:#fff}button:focus-visible,a:focus-visible{outline:3px solid #d8ad57;outline-offset:4px}.note{text-align:center;font-size:12px}@media(max-width:580px){main{padding:24px 18px}h1{font-size:24px;margin-top:25px}#stage{height:490px;margin:0 -14px}button{padding:10px 15px;font-size:12px}p{font-size:12px}}
  </style>
</head>
<body><main>
  <a href="./">← 게임으로 돌아가기</a>
  <h1>말랑한 친구들의 한판</h1>
  <p>작은 점눈, 작은 미소. 게임에 적용한 캐릭터와 공격 동작을 가까이서 보세요.</p>
  <div id="stage"><canvas id="characters" aria-label="곰, 토끼, 고양이, 강아지의 실제 3D 모델과 동작 미리보기"></canvas></div>
  <nav aria-label="캐릭터 동작"><button type="button" data-motion="ready" aria-pressed="true">대기 자세</button><button type="button" data-motion="punch" aria-pressed="false">맨손 공격</button><button type="button" data-motion="sword" aria-pressed="false">검 휘두르기</button><button type="button" data-motion="spin" aria-pressed="false">회전 공격</button></nav>
  <p class="note">게임과 같은 모델·애니메이션을 사용하는 동작 미리보기입니다.</p>
</main><script type="module" src="./character-preview-Z4SQIAC5.mjs"></script></body>
</html>
